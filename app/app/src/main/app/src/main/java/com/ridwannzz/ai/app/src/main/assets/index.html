<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ridwannzz Ai</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#10111a;color:#fff;
 font-family:Arial,sans-serif
}
header{
 padding:24px 18px;
 background:linear-gradient(135deg,#5728b8,#1769aa);
 border-radius:0 0 22px 22px
}
h1{margin:0;font-size:26px}
header p{font-size:14px;color:#e5e1ff}
main{padding:16px;max-width:650px;margin:auto}
.card{
 background:#1b1b2b;border:1px solid #363650;
 border-radius:16px;padding:16px;margin-bottom:15px
}
label{display:block;margin:12px 0 7px;color:#c7c6df;font-size:14px}
input,textarea{
 width:100%;padding:12px;border-radius:10px;
 background:#10111a;color:white;border:1px solid #44445f;
 font-size:15px
}
textarea{min-height:110px;resize:vertical}
button{
 padding:12px 16px;border:0;border-radius:10px;
 background:#7950e8;color:white;font-weight:bold;
 margin:9px 5px 0 0
}
.secondary{background:#38384d}
#answer{white-space:pre-wrap;line-height:1.6;overflow-wrap:anywhere}
.small{font-size:12px;color:#aaa9c0;line-height:1.5}
#status{font-size:13px;color:#c3b4ff}
</style>
</head>

<body>
<header>
<h1>✦ Ridwannzz Ai</h1>
<p>Asisten AI untuk belajar dan mencari jawaban.</p>
</header>

<main>
<div class="card">
<strong>Pengaturan Gemini</strong>

<label for="key">Gemini API Key</label>
<input id="key" type="password" placeholder="Masukkan API key">

<p class="small">
API key digunakan untuk mengirim pertanyaan ke Gemini.
Jangan bagikan kunci ini kepada orang lain.
</p>
</div>

<div class="card">
<strong>Chat AI</strong>

<label for="question">Tulis pertanyaan</label>
<textarea id="question" placeholder="Halo Ridwannzz Ai, bantu aku memahami..."></textarea>

<button id="ask" onclick="askAI()">Kirim pertanyaan</button>
<button class="secondary" onclick="clearChat()">Bersihkan</button>

<p id="status"></p>

<hr style="border-color:#38384d">

<strong>Jawaban AI</strong>
<p id="answer">Jawaban akan muncul di sini.</p>

<button class="secondary" onclick="copyAnswer()">Salin jawaban</button>
</div>

<p class="small">
Gunakan AI secara bertanggung jawab dan ikuti aturan yang berlaku.
</p>
</main>

<script>
async function askAI(){
 const key=document.getElementById('key').value.trim();
 const question=document.getElementById('question').value.trim();
 const answer=document.getElementById('answer');
 const status=document.getElementById('status');
 const button=document.getElementById('ask');

 if(!key){
  status.textContent='Masukkan API key terlebih dahulu.';
  return;
 }
 if(!question){
  status.textContent='Tulis pertanyaan terlebih dahulu.';
  return;
 }

 button.disabled=true;
 status.textContent='Ridwannzz Ai sedang berpikir...';
 answer.textContent='';

 try{
  const url='https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(key);

  const response=await fetch(url,{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({
    contents:[{
     parts:[{text:question}]
    }]
   })
  });

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.error?.message||'Permintaan gagal.');
  }

  answer.textContent=data.candidates?.[0]?.content?.parts
   ?.map(part=>part.text||'').join('\n')||'Tidak ada jawaban.';

  status.textContent='Selesai!';

 }catch(error){
  status.textContent='Terjadi kesalahan: '+error.message;
 }finally{
  button.disabled=false;
 }
}

function clearChat(){
 document.getElementById('question').value='';
 document.getElementById('answer').textContent='Jawaban akan muncul di sini.';
 document.getElementById('status').textContent='';
}

async function copyAnswer(){
 const text=document.getElementById('answer').textContent;

 try{
  await navigator.clipboard.writeText(text);
  document.getElementById('status').textContent='Jawaban berhasil disalin.';
 }catch(error){
  document.getElementById('status').textContent='Penyalinan otomatis tidak tersedia.';
 }
}
</script>
</body>
</html>
